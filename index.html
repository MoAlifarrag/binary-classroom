<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Classroom</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><section class="card" id="login"><h1>⚡ Binary Classroom</h1><p class="muted">Enter your details to join.</p><div class="row"><input id="code" placeholder="Student code"><input id="name" placeholder="Full name"><select id="className"><option value="">Choose class</option><option>1A</option><option>1B</option><option>1C</option><option>1D</option></select></div><p><button class="primary" id="join">JOIN GAME</button></p><p id="loginMsg"></p></section><section class="card hidden" id="game"><div class="row" style="justify-content:space-between"><div><b id="who"></b><div id="cls"></div></div><div class="stats"><div class="pill">Question <span id="q">1</span>/10</div><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱ <span id="time">20</span>s</div></div></div><p class="center muted">Build this decimal number:</p><div class="target" id="target"></div><div class="bits" id="bits"></div><div class="binary" id="binary">0000</div><div class="feedback" id="feedback"></div><p class="center"><button class="primary" id="check">CHECK ✓</button></p></section><section class="card hidden center" id="done"><h2>🏁 Finished!</h2><div class="big" id="finalScore"></div><p>Check the classroom leaderboard.</p></section></div><script>document.getElementById("loginMsg").textContent="App loaded ✓";window.addEventListener("error",e=>document.getElementById("loginMsg").textContent="JS error: "+e.message);window.addEventListener("unhandledrejection",e=>document.getElementById("loginMsg").textContent="Error: "+(e.reason?.code||e.reason?.message||e.reason));</script><script type="module" src="student.js?v=3"></script></body></html>
